plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = findProperty('mod_version') ?: '1.0.0'
group = 'io.github.winking114.hollowrealm.tweaks'
base.archivesName = 'HollowRealm-Tweaks'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def mcLibs = file('C:/Users/WinKing/Documents/.minecraft/libraries')
def instanceMods = file('C:/Users/WinKing/Documents/.minecraft/versions/HollowRealm/mods')
def externalModJars = files(
    new File(mcLibs, 'org/spongepowered/mixin/0.8.5/mixin-0.8.5.jar'),
    new File(instanceMods, '[神化] Apotheosis-1.20.1-7.4.8.jar'),
    new File(instanceMods, 'Placebo-1.20.1-8.6.3.jar'),
    new File(instanceMods, 'fallen_gems_affixes-1.20.1-2.1.5.jar'),
    new File(instanceMods, 'ancientreforging-1.3.jar'),
    new File(instanceMods, '[Iron的法术与魔法书] irons_spellbooks-1.20.1-3.16.4.jar'),
    new File(instanceMods, 'forbidden_tiers-1.20.1-1.0.1.jar'),
    new File(instanceMods, 'ApothicAttributes-1.20.1-1.3.7.jar'),
    new File(instanceMods, 'curios-forge-5.14.1+1.20.1.jar')
)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            mods { hollowrealm_tweaks { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
            mods { hollowrealm_tweaks { source sourceSets.main } }
        }
    }
}

repositories { mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.29'
    compileOnly externalModJars
    testImplementation externalModJars
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) {
    useJUnitPlatform()
    maxParallelForks = 1
    systemProperty 'hrtweaks.mods', instanceMods.absolutePath.replace('\\', '/')
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}
tasks.named('jar', Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest.attributes(
        'Implementation-Title': 'HollowRealm Tweaks',
        'Implementation-Version': project.version,
        'MixinConfigs': 'hollowrealm-tweaks.mixins.json'
    )
    finalizedBy 'reobfJar'
}

// A separate test-only mod. It is never included in the deliverable JAR.
sourceSets {
    probe {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('probeJar', Jar) {
    archiveBaseName = 'hollowrealm-tweaks-probe'
    from sourceSets.probe.output
    finalizedBy 'reobfProbeJar'
}
reobf { probeJar {} }
