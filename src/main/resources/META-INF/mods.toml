description='''Audited server-data compatibility, crit-attribute unification, and modpack integration tweaks for HollowRealm (Minecraft 1.20.1 / Forge): repairs Critters and Companions clam loot modifier condition IDs, restores Legendary Monsters' bottle_of_annihilation crafting recipe, gates Scguns affixes and broken Fallen Gems & Affixes compat files, enables Fabled Reforging Table support for Apotheosis Ancient Material, tunes Iron's Spellbooks + Forbidden Tiers 7-tier spell loot rarity distribution, and unifies secondary crit-rate/crit-damage attributes into ApothicAttributes (replacing Fused Critical). All patches are audited and fail closed.'''

